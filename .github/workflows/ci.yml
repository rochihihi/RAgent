name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format . --check
      - name: Type check
        run: python -m mypy src
      - name: Tests and coverage
        run: python -m pytest --cov=veripatch --cov-report=term-missing --cov-fail-under=90
      - name: Build package
        run: python -m build --no-isolation
      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/veripatch-wheel
          /tmp/veripatch-wheel/bin/python -m pip install dist/*.whl
          /tmp/veripatch-wheel/bin/veripatch --help

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sandbox image
        run: docker build -t veripatch-sandbox:ci -f sandbox/Dockerfile .
      - name: Build API image
        run: docker build -t veripatch-api:ci .
